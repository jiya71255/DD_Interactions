[project]
name = "ddi-interactions"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "starlette>=0.46,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
  "python-multipart>=0.0.9,<1",
  "python-dotenv>=1.0,<2",
  "rdkit>=2024.3"
]

[tool.vercel]
entrypoint = "backend.main: app"
